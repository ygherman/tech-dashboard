name: daily-dashboard

on:
  schedule:
    - cron: "0 4 * * 2-6"   # 04:00 UTC = 07:00 Israel (06:00 in winter), Tue-Sat
  workflow_dispatch:         # "Run workflow" button for a manual refresh
  push:
    branches: [main]
    paths: [watchlist.txt]   # rebuild right after the watchlist is edited

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tech_dashboard.py --out site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
